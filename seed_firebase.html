    async function seedCollection(collectionName, items) {
        log(`Seeding ${items.length} records into <b>${collectionName}</b>...`, 'info');
        const batch = db.batch();
        items.forEach(item => {
            const ref = db.collection(collectionName).doc(item._docId);
            batch.set(ref, item);
        });
        await batch.commit();
        log(`✅ ${items.length} records seeded into ${collectionName}`, 'ok');
    }

    async function runSeed() {
        const btn = document.getElementById('seedBtn');
        btn.disabled = true;
        btn.textContent = '⏳ Seeding...';
        try {
            log('🔥 Connecting to Firebase...', 'info');
            await seedCollection('pseudopy_users', buildUsers());
            await seedCollection('pseudopy_exercises', EXERCISES);
            await seedCollection('pseudopy_activity', buildActivity());
            log('', 'info');
            log('🎉 All done! Firebase is seeded. You can close this tab now.', 'ok');
            log('👉 Open your Vercel app and login with: mbautista_admin / admin123', 'ok');
        } catch (err) {
            log('❌ Error: ' + err.message, 'err');
            console.error(err);
        }
        btn.disabled = false;
        btn.textContent = '▶ Seed Again';
    }
