<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PseudoPy — Firebase Seed Tool</title>
  <style>
    body { font-family: monospace; background: #0f172a; color: #e2e8f0; padding: 2rem; }
    h1 { color: #3b82f6; }
    button { background: #3b82f6; color: white; border: none; padding: 0.75rem 2rem; font-size: 1rem; border-radius: 8px; cursor: pointer; margin: 1rem 0; }
    button:hover { background: #2563eb; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #log { background: #1e293b; padding: 1rem; border-radius: 8px; max-height: 500px; overflow-y: auto; font-size: 0.85rem; line-height: 1.6; }
    .ok { color: #22c55e; }
    .err { color: #ef4444; }
    .info { color: #93c5fd; }
    .warn { color: #fbbf24; }
  </style>
</head>
<body>
  <h1>🔥 PseudoPy Firebase Seed Tool</h1>
  <p>This page seeds initial data (users, exercises, activity) into Firebase Firestore.<br>
  Run this <strong>once</strong> after setting up your Firebase project.</p>
  <button id="seedBtn" onclick="runSeed()">▶ Seed Firebase Database</button>
  <button onclick="clearLog()" style="background:#475569;margin-left:1rem">Clear Log</button>
  <div id="log"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
        apiKey: "AIzaSyAkm5sWJpcF05QCDDSa8VciUTh3LOc5BU",
        authDomain: "pseudopy-e7e74.firebaseapp.com",
        projectId: "pseudopy-e7e74",
        storageBucket: "pseudopy-e7e74.firebasestorage.app",
        messagingSenderId: "442671972919",
        appId: "1:442671972919:web:53fc4b941b37c484247ab2"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function log(msg, type = 'info') {
        const div = document.getElementById('log');
        div.innerHTML += `<div class="${type}">${new Date().toLocaleTimeString()} — ${msg}</div>`;
        div.scrollTop = div.scrollHeight;
    }
    function clearLog() { document.getElementById('log').innerHTML = ''; }

    const FILIPINO_NAMES = [
        "John Cruz","Maria Santos","Kevin Ramos","Anna Reyes","Joshua Garcia",
        "Carlo Mendoza","Patricia Flores","Mark Bautista","Nicole Dela Cruz","Michael Reyes",
        "Christian Alde","Jessica Pascual","Aldrin Castro","Kenneth Santos","Jasmine Aquino",
        "Justin Ferrer","Bianca De Leon","Aaron Dizon","Camille Valenzuela","Dominic Ramos",
        "Ella Salvador","Adrian Tolentino","Sofia Corpuz","Patrick Hernandez","Hazel Gonzales",
        "Gabriel Santiago","Abigail Ramos","Ryan Ocampo","Megan Custodio","Kyle Dela Rosa"
    ];

    function buildUsers() {
        const users = [
            { _docId:'u1', id:'u1', fullName:'Mark Bautista', username:'mbautista_admin', email:'bautista@university.edu.ph', password:'admin123', role:'admin', status:'active', createdAt:'2025-07-01T08:00:00.000Z' },
            { _docId:'u2', id:'u2', fullName:'Marc Reantaso', username:'mreantaso_instructor', email:'reantaso@university.edu.ph', password:'pass123', role:'instructor', status:'active', createdBy:'u1', createdAt:'2025-08-10T14:15:00.000Z' },
            { _docId:'u_stu_emirandilla', id:'u_stu_emirandilla', studentId:'2024-031', fullName:'Eduard John Mirandilla', username:'emirandilla_student', email:'mirandilla@gmail.com', password:'pass123', role:'student', status:'active', instructorId:'u2', createdBy:'u2', section:'BSCS-3A', createdAt:'2025-08-10T14:30:00.000Z' },
            { _docId:'u_stu_mdaet', id:'u_stu_mdaet', studentId:'2024-032', fullName:'Mikaella Daet', username:'mdaet_student', email:'daet@gmail.com', password:'pass123', role:'student', status:'active', instructorId:'u2', createdBy:'u2', section:'BSCS-3A', createdAt:'2025-08-10T14:35:00.000Z' },
        ];
        FILIPINO_NAMES.forEach((name, i) => {
            const clean = name.toLowerCase().replace(/\s+/g,'');
            users.push({ _docId:`u_stu_${i+3}`, id:`u_stu_${i+3}`, studentId:`2024-${String(i+1).padStart(3,'0')}`, fullName:name, username:`${clean}_student`, email:`${clean.split(' ')[0]}@student.edu.ph`, password:'pass123', role:'student', status:'active', instructorId:'u2', createdBy:'u2', section:['BSCS-3A','BSCS-3B','BSIT-3A','BSIT-3B'][i%4] });
        });
        return users;
    }

    const EXERCISES = [
        { _docId:'seed_easy_1', id:'seed_easy_1', title:'Multiply Array Elements', description:'Multiply every element in an array by 4 and output the transformed list.', difficulty:'easy', python_code:'values = [8, 4, 1, 6, 4, 13, 6]\nfor i in range(len(values)):\n    values[i] = values[i] * 4\nprint(values)', createdAt:'2025-08-08' },
        { _docId:'seed_medium_1', id:'seed_medium_1', title:'Sum Odd Numbers', description:'Calculate the sum of odd numbers less than 100 and print the result.', difficulty:'moderate', python_code:'total = 0\ni = 1\nwhile i < 100:\n    total += i\n    i += 2\nprint(total)', createdAt:'2025-08-08' },
        { _docId:'seed_medium_2', id:'seed_medium_2', title:'Count Multiples of 4 and 7', description:'Count numbers between 1 and 20 that are multiples of 4 or 7.', difficulty:'moderate', python_code:'count = 0\nfor i in range(1, 21):\n    if i % 4 == 0 or i % 7 == 0:\n        count += 1\nprint(count)', createdAt:'2025-08-08' },
        { _docId:'seed_hard_1', id:'seed_hard_1', title:'Factorial Computation', description:'Compute the factorial of 6 using a loop and print the final result.', difficulty:'hard', python_code:'result = 1\nfor i in range(1, 7):\n    result *= i\nprint(result)', createdAt:'2025-08-08' }
    ];

    function makeAct(id, student, studentId, exercise, difficulty, status, score, dateStr, errorType, procTime) {
        return { _docId:id, student, studentId, exercise, difficulty:difficulty||'moderate', status, score, time:dateStr, timestamp:new Date(dateStr).getTime(), errorType:errorType||null, processingTime:procTime||'0.0s', submittedCode:'BEGIN\n  PRINT "Hello World"\nEND', pseudocode:'BEGIN\n  PRINT "Hello World"\nEND', pythonCode:'print("Hello World")', python_code:'print("Hello World")', result:status==='Completed'?'Success':status==='Failed'?errorType:'Pending', output:status==='Failed'?`Error: ${errorType} during compilation`:'Execution successful.\n' };
    }

    function buildActivity() {
        const acts = [
            makeAct('act_sp_1','John Cruz','2024-001','Sum of Even Numbers','moderate','Completed','100%','2025-08-08T10:15:00',null,'0.85s'),
            makeAct('act_sp_2','Maria Santos','2024-002','Factorial Calculation','hard','Completed','85%','2025-08-08T10:32:00',null,'1.21s'),
            makeAct('act_sp_3','Kevin Ramos','2024-003','Array Sum','easy','Failed','0%','2025-08-08T11:05:00','Syntax Error','0.65s'),
            makeAct('act_sp_4','Anna Reyes','2024-004','Prime Number Checker','moderate','Pending','-','2025-08-08T11:20:00',null,'-'),
            makeAct('act_sp_5','Joshua Garcia','2024-005','String Reversal','easy','Completed','90%','2025-08-08T11:45:00',null,'0.42s'),
            makeAct('act_sp_em1','Eduard John Mirandilla','2024-031','Sum of Even Numbers','moderate','Completed','100%','2025-08-08T14:20:00',null,'0.78s'),
            makeAct('act_sp_em2','Eduard John Mirandilla','2024-031','Factorial Calculation','hard','Completed','95%','2025-08-07T16:10:00',null,'1.10s'),
            makeAct('act_sp_md1','Mikaella Daet','2024-032','Array Sum','easy','Completed','90%','2025-08-08T15:00:00',null,'0.52s'),
            makeAct('act_sp_md2','Mikaella Daet','2024-032','Prime Number Checker','moderate','Completed','100%','2025-08-06T11:30:00',null,'0.89s'),
        ];
        return acts;
    }

    async function seedCollection(collectionName, items) {
        log(`Seeding ${items.length} records into <b>${collectionName}</b>...`, 'info');
        const batch = db.batch();
        items.forEach(item => {
            const ref = db.collection(collectionName).doc(item._docId);
            batch.set(ref, item);
        });
        await batch.commit();
        log(`✅ ${items.length} records seeded into ${collectionName}`, 'ok');
    }

    async function runSeed() {
        const btn = document.getElementById('seedBtn');
        btn.disabled = true;
        btn.textContent = '⏳ Seeding...';
        try {
            log('🔥 Connecting to Firebase...', 'info');
            await seedCollection('pseudopy_users', buildUsers());
            await seedCollection('pseudopy_exercises', EXERCISES);
            await seedCollection('pseudopy_activity', buildActivity());
            log('', 'info');
            log('🎉 All done! Firebase is seeded. You can close this tab now.', 'ok');
            log('👉 Open your Vercel app and login with: mbautista_admin / admin123', 'ok');
        } catch (err) {
            log('❌ Error: ' + err.message, 'err');
            console.error(err);
        }
        btn.disabled = false;
        btn.textContent = '▶ Seed Again';
    }
  </script>
</body>
</html>
