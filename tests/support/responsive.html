<!doctype html><html lang="en"><meta charset="utf-8"><title>PseudoPy isolated responsive QA</title><style>body{font:16px system-ui;background:#dae2ef}iframe{height:760px;border:2px solid #334}</style><h1>Isolated responsive QA</h1><p>These frames use synthetic test records and never connect to Firebase.</p><a href="?role=student&width=360">Student 360px</a> · <a href="?role=instructor&width=768">Instructor 768px</a> · <a href="?role=admin&width=360">Admin 360px</a><p id="label"></p><iframe title="Responsive application"></iframe><script>const q=new URLSearchParams(location.search),role=['student','instructor','admin'].includes(q.get('role'))?q.get('role'):'student',width=[360,768].includes(Number(q.get('width')))?Number(q.get('width')):360;document.querySelector('iframe').width=width;document.querySelector('iframe').src='/'+role+'/'+(role==='student'?'translator':role==='instructor'?'submissions':'dashboard');document.querySelector('#label').textContent=role+' at '+width+' CSS pixels';</script></html>
